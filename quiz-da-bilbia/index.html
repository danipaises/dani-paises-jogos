<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz da Bíblia — Dani Países Games</title>
<style>
:root{--bg:#07111f;--panel:rgba(255,255,255,.94);--ink:#172033;--muted:#64748b;--gold:#d97706;--blue:#1d4ed8;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 12% 10%,rgba(217,119,6,.3),transparent 30rem),radial-gradient(circle at 88% 18%,rgba(29,78,216,.28),transparent 30rem),linear-gradient(145deg,#07111f,#14213a 55%,#07131f);color:var(--ink);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:34px 34px}.app{width:min(760px,100%);position:relative;background:var(--panel);border:1px solid rgba(255,255,255,.8);border-radius:26px;box-shadow:0 30px 90px rgba(2,6,23,.34);backdrop-filter:blur(18px);overflow:hidden}.topbar{padding:22px 24px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:white;font-size:24px;background:linear-gradient(135deg,var(--gold),var(--blue));box-shadow:0 12px 28px rgba(29,78,216,.25)}h1{font-size:clamp(1.35rem,4vw,2rem);margin:0;letter-spacing:-.03em}.subtitle{margin:3px 0 0;color:var(--muted);font-size:.94rem}.record{padding:10px 14px;border-radius:999px;background:#fff7ed;color:#9a3412;font-weight:800;white-space:nowrap}.progress-wrap{padding:0 24px 16px}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;font-weight:700;margin-bottom:8px}.progress{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--blue));transition:width .3s ease}.content{padding:6px 24px 26px}.card{background:white;border:1px solid #e2e8f0;border-radius:22px;padding:22px;box-shadow:0 14px 36px rgba(15,23,42,.09)}.question{font-size:clamp(1.18rem,3.6vw,1.55rem);font-weight:850;line-height:1.35;margin:0 0 18px}.answers{display:grid;gap:12px}.answer{appearance:none;width:100%;border:1px solid #dbe4f0;background:#f8fafc;color:#172033;padding:15px 16px;border-radius:15px;text-align:left;font:inherit;font-weight:750;cursor:pointer;transition:.16s ease;box-shadow:0 7px 18px rgba(15,23,42,.06)}.answer:hover{transform:translateY(-2px);border-color:#93c5fd;background:#eff6ff}.answer:active{transform:scale(.99)}.answer:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:4px solid #facc15;outline-offset:3px}.answer.correct{background:#dcfce7;border-color:#86efac;color:#166534}.answer.wrong{background:#fee2e2;border-color:#fca5a5;color:#991b1b}.answer:disabled{cursor:default}.feedback{min-height:34px;padding-top:14px;font-weight:800}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}.primary,.secondary{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:850;cursor:pointer;transition:.16s ease}.primary{background:linear-gradient(135deg,var(--blue),#4338ca);color:white;box-shadow:0 12px 25px rgba(29,78,216,.25)}.secondary{background:#e2e8f0;color:#334155}.primary:hover,.secondary:hover{transform:translateY(-2px)}.hidden{display:none!important}.start,.finish{text-align:center;padding:16px 0 2px}.hero{font-size:56px;margin:4px 0 10px}.start p,.finish p{color:var(--muted);line-height:1.55}.big-score{font-size:clamp(2.6rem,10vw,4.5rem);font-weight:950;letter-spacing:-.05em;color:var(--blue);margin:4px 0}.kbd{display:inline-flex;align-items:center;gap:6px;color:#64748b;font-size:.82rem;margin-top:14px}kbd{border:1px solid #cbd5e1;background:white;border-bottom-width:3px;border-radius:7px;padding:2px 7px;font:inherit;font-weight:800}@media(max-width:560px){body{padding:0;background:#0c1628}.app{min-height:100vh;border-radius:0}.topbar,.progress-wrap,.content{padding-left:16px;padding-right:16px}.record{font-size:.85rem}.card{padding:18px}.answer{min-height:54px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app"><header class="topbar"><div class="brand"><div class="logo" aria-hidden="true">✦</div><div><h1>Quiz da Bíblia</h1><p class="subtitle">Dani Países Games</p></div></div><div class="record">🏆 Recorde: <span id="best">0</span></div></header><div class="progress-wrap"><div class="progress-label"><span id="stage">Pronto para começar</span><span id="scoreLabel">0 pontos</span></div><div class="progress"><i id="progressBar"></i></div></div><section class="content"><div class="card"><div id="startScreen" class="start"><div class="hero">📖</div><h2>Quanto você conhece a Bíblia?</h2><p>São 15 perguntas, quatro alternativas e um recorde salvo neste navegador. No PC, você também pode responder usando as teclas <strong>1, 2, 3 e 4</strong>.</p><button class="primary" id="startBtn">Começar quiz</button></div><div id="quizScreen" class="hidden"><p class="question" id="question"></p><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="primary hidden" id="nextBtn">Próxima</button></div><div class="kbd"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> para responder</div></div><div id="finishScreen" class="finish hidden"><div class="hero">🏅</div><h2>Fim do quiz!</h2><div class="big-score"><span id="finalScore">0</span>/15</div><p id="finalMessage"></p><div class="actions" style="justify-content:center"><button class="secondary" id="reviewBtn">Ver resultado</button><button class="primary" id="restartBtn">Jogar novamente</button></div></div></div></section></main>
<script>
const QUESTIONS=[{q:"Quem construiu a arca antes do dilúvio?",a:["Abraão","Moisés","Noé","Davi"],c:2},{q:"Quem enfrentou Golias?",a:["Davi","Salomão","Samuel","Josué"],c:0},{q:"Em qual cidade Jesus nasceu?",a:["Nazaré","Belém","Jerusalém","Cafarnaum"],c:1},{q:"Quem recebeu os Dez Mandamentos?",a:["Moisés","Pedro","Paulo","Isaías"],c:0},{q:"Qual era o nome da mãe de Jesus?",a:["Marta","Maria","Rute","Ester"],c:1},{q:"Quem foi lançado na cova dos leões?",a:["José","Daniel","Elias","Jonas"],c:1},{q:"Quem foi engolido por um grande peixe?",a:["Jonas","Amós","Neemias","João"],c:0},{q:"Quantos apóstolos Jesus escolheu?",a:["7","10","12","14"],c:2},{q:"Quem traiu Jesus?",a:["Tomé","Judas Iscariotes","André","Filipe"],c:1},{q:"Qual foi o primeiro livro da Bíblia?",a:["Êxodo","Salmos","Gênesis","Mateus"],c:2},{q:"Quem era conhecido por sua grande força?",a:["Sansão","Saul","Jó","Lucas"],c:0},{q:"Quem interpretou sonhos no Egito e se tornou governador?",a:["José","Isaque","Jacó","Arão"],c:0},{q:"Qual discípulo negou Jesus três vezes?",a:["João","Tiago","Pedro","Mateus"],c:2},{q:"Quem pediu sabedoria a Deus e ficou conhecido por ela?",a:["Salomão","Davi","Elias","Timóteo"],c:0},{q:"Qual é o último livro do Novo Testamento?",a:["Judas","Hebreus","Apocalipse","Atos"],c:2}];const $=s=>document.querySelector(s),startScreen=$("#startScreen"),quizScreen=$("#quizScreen"),finishScreen=$("#finishScreen"),questionEl=$("#question"),answersEl=$("#answers"),feedback=$("#feedback"),nextBtn=$("#nextBtn"),progressBar=$("#progressBar"),stage=$("#stage"),scoreLabel=$("#scoreLabel"),bestEl=$("#best"),BEST_KEY="daniPaisesQuizBibliaBest";let order=[],index=0,score=0,locked=false;function best(){return Number(localStorage.getItem(BEST_KEY)||0)}function setBest(v){if(v>best())localStorage.setItem(BEST_KEY,String(v));bestEl.textContent=best()}function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function begin(){order=shuffle([...QUESTIONS.keys()]);index=0;score=0;locked=false;startScreen.classList.add("hidden");finishScreen.classList.add("hidden");quizScreen.classList.remove("hidden");render()}function render(){locked=false;feedback.textContent="";nextBtn.classList.add("hidden");answersEl.innerHTML="";const item=QUESTIONS[order[index]];questionEl.textContent=item.q;stage.textContent=`Pergunta ${index+1} de ${QUESTIONS.length}`;scoreLabel.textContent=`${score} ${score===1?"ponto":"pontos"}`;progressBar.style.width=`${index/QUESTIONS.length*100}%`;item.a.forEach((txt,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=`${i+1}. ${txt}`;b.addEventListener("click",()=>answer(i,b));answersEl.appendChild(b)})}function answer(choice,btn){if(locked)return;locked=true;const item=QUESTIONS[order[index]],buttons=[...answersEl.children];buttons.forEach((b,i)=>{b.disabled=true;if(i===item.c)b.classList.add("correct")});if(choice===item.c){score++;feedback.textContent="✅ Resposta correta!";feedback.style.color="#166534"}else{btn.classList.add("wrong");feedback.textContent=`❌ A resposta correta é: ${item.a[item.c]}.`;feedback.style.color="#991b1b"}scoreLabel.textContent=`${score} ${score===1?"ponto":"pontos"}`;progressBar.style.width=`${(index+1)/QUESTIONS.length*100}%`;nextBtn.textContent=index===QUESTIONS.length-1?"Ver resultado":"Próxima";nextBtn.classList.remove("hidden")}function next(){if(!locked)return;index++;index>=QUESTIONS.length?finish():render()}function finish(){setBest(score);quizScreen.classList.add("hidden");finishScreen.classList.remove("hidden");$("#finalScore").textContent=score;stage.textContent="Quiz concluído";progressBar.style.width="100%";let msg=score===15?"Perfeito! Você acertou todas.":score>=12?"Excelente resultado!":score>=8?"Muito bom! Continue praticando.":"Boa tentativa! Jogue novamente para melhorar.";$("#finalMessage").textContent=msg+(score===best()?" 🏆":"")}function review(){alert(`Você fez ${score} de ${QUESTIONS.length} pontos. Seu recorde neste navegador é ${best()}.`)}$("#startBtn").addEventListener("click",begin);$("#restartBtn").addEventListener("click",begin);$("#reviewBtn").addEventListener("click",review);nextBtn.addEventListener("click",next);document.addEventListener("keydown",e=>{if(!quizScreen.classList.contains("hidden")&&!locked&&["1","2","3","4"].includes(e.key)){const b=answersEl.children[Number(e.key)-1];if(b)b.click()}else if(!quizScreen.classList.contains("hidden")&&locked&&(e.key==="Enter"||e.key===" "))nextBtn.click()});bestEl.textContent=best();
</script></body></html>
