<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Adivinhando Emoções — Remaster</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{display:grid;place-items:center;background:#08111f;color:#e5eefc;padding:24px}
  .loader{width:min(620px,100%);padding:28px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(15,23,42,.82);box-shadow:0 30px 90px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
  .loader h1{margin:0 0 10px;font-size:clamp(1.45rem,4vw,2.25rem)}
  .loader p{margin:8px 0;color:#bfd0e7;line-height:1.55}
  .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:20px}
  .bar i{display:block;height:100%;width:42%;border-radius:inherit;background:linear-gradient(90deg,#7c3aed,#ec4899);animation:load 1.05s ease-in-out infinite alternate}
  @keyframes load{to{transform:translateX(138%)}}
  .error{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#3f1118;color:#fecaca;white-space:pre-wrap}
</style>
</head>
<body>
<main class="loader" aria-live="polite">
  <h1>Adivinhando Emoções — Remaster</h1>
  <p>Carregando a versão original do jogo e aplicando o remaster visual sem alterar a lógica de pontuação e recordes.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="error" id="error"></div>
</main>
<script>
(async()=>{
  const sourcePath = "Adivinhando-emocoes/index.html";
  const commit = "6fb3b231e226c51af22dade20d36e6d339ca06d7";
  const owner = "danipaises";
  const repo = "dani-paises-jogos";
  const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${commit}/${sourcePath.split('/').map(encodeURIComponent).join('/')}`;
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${sourcePath.split('/').map(encodeURIComponent).join('/')}?ref=${commit}`;
  const folderPath = sourcePath.slice(0, sourcePath.lastIndexOf('/') + 1);
  const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/${commit}/${folderPath.split('/').filter(Boolean).map(encodeURIComponent).join('/')}/`;
  const remasterCss = "\n/* =========================================================\n   DANI PAÍSES GAMES — VISUAL REMASTER TEST BUILD\n   Camada visual conservadora: não altera pontuação/recordes.\n   ========================================================= */\n:root{\n  --dp-accent:#7c3aed;\n  --dp-accent-2:#ec4899;\n  --dp-shadow:0 24px 70px rgba(2,6,23,.24);\n  --dp-soft-shadow:0 12px 34px rgba(2,6,23,.14);\n  --dp-radius:22px;\n}\nhtml{min-height:100%;background:#07111f}\nbody{\n  min-height:100vh;\n  background:\n    radial-gradient(circle at 12% 8%,rgba(124,58,237,.28),transparent 33rem),\n    radial-gradient(circle at 88% 16%,rgba(236,72,153,.22),transparent 30rem),\n    radial-gradient(circle at 50% 105%,rgba(124,58,237,.12),transparent 34rem),\n    linear-gradient(145deg,#07111f 0%,#101a31 50%,#07131f 100%) !important;\n  background-attachment:fixed!important;\n}\nbody::before{\n  content:\"\";\n  position:fixed;\n  inset:0;\n  pointer-events:none;\n  z-index:0;\n  opacity:.16;\n  background-image:\n    linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),\n    linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);\n  background-size:36px 36px;\n  mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 88%);\n}\nbody > *{position:relative;z-index:1}\n:is(\n  .container,.card,.game-card,.start-card,.panel,.game-panel,\n  #game-container,#start-screen,#mode-selection-screen,#difficulty-selection-screen,\n  #menu,#game,#app,#quiz-container,#leaderboard-modal .modal-content\n){\n  border-radius:var(--dp-radius)!important;\n}\n:is(\n  .card,.game-card,.start-card,.panel,.game-panel,\n  #game-container,#start-screen,#mode-selection-screen,#difficulty-selection-screen,\n  #menu,#quiz-container,#leaderboard-modal .modal-content\n){\n  box-shadow:var(--dp-shadow)!important;\n  border:1px solid rgba(255,255,255,.72)!important;\n  backdrop-filter:blur(18px) saturate(1.12);\n  -webkit-backdrop-filter:blur(18px) saturate(1.12);\n}\nbutton,.btn,[role=\"button\"]{\n  border-radius:14px!important;\n  box-shadow:0 10px 24px rgba(2,6,23,.16)!important;\n  transition:transform .16s ease,box-shadow .16s ease,filter .16s ease!important;\n  touch-action:manipulation;\n  -webkit-tap-highlight-color:transparent;\n}\n@media (hover:hover) and (pointer:fine){\n  button:hover,.btn:hover,[role=\"button\"]:hover{\n    transform:translateY(-2px);\n    box-shadow:0 15px 32px rgba(2,6,23,.22)!important;\n    filter:saturate(1.08) brightness(1.03);\n  }\n}\nbutton:active,.btn:active,[role=\"button\"]:active{transform:translateY(0) scale(.985)}\nbutton:focus-visible,.btn:focus-visible,[role=\"button\"]:focus-visible,\ninput:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{\n  outline:3px solid var(--dp-accent-2)!important;\n  outline-offset:3px!important;\n}\ninput,select,textarea{\n  border-radius:14px!important;\n  box-shadow:0 7px 20px rgba(2,6,23,.08);\n}\nh1,h2,h3{\n  text-wrap:balance;\n  text-shadow:0 5px 18px rgba(2,6,23,.08);\n}\ncanvas{\n  max-width:100%;\n  height:auto;\n  border-radius:20px!important;\n  box-shadow:0 22px 60px rgba(2,6,23,.26)!important;\n  outline:1px solid rgba(255,255,255,.58);\n}\nimg{\n  image-rendering:auto;\n}\n:is(.modal,.overlay,[class*=\"modal\"],[class*=\"overlay\"]){\n  backdrop-filter:blur(8px);\n  -webkit-backdrop-filter:blur(8px);\n}\n:is(#score,#best-score,#high-score,#record,[id*=\"score\"],[id*=\"record\"],[class*=\"score\"],[class*=\"record\"]){\n  font-variant-numeric:tabular-nums;\n}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-track{background:rgba(255,255,255,.12)}\n::-webkit-scrollbar-thumb{\n  background:linear-gradient(var(--dp-accent),var(--dp-accent-2));\n  border-radius:999px;\n}\n@media (max-width:640px){\n  body{background-attachment:scroll!important}\n  :is(.card,.game-card,.start-card,.panel,.game-panel,#game-container,#start-screen,#menu,#quiz-container){\n    border-radius:18px!important;\n  }\n  button,.btn,[role=\"button\"]{min-height:46px}\n}\n@media (prefers-reduced-motion:reduce){\n  html:focus-within{scroll-behavior:auto}\n  *,*::before,*::after{\n    animation-duration:.01ms!important;\n    animation-iteration-count:1!important;\n    transition-duration:.01ms!important;\n  }\n}\n[class*=\"emoji\"],[id*=\"emoji\"]{filter:drop-shadow(0 12px 22px rgba(124,58,237,.22))}\n";

  async function getOriginal(){
    try{
      const r = await fetch(rawUrl, {cache:"no-store"});
      if(r.ok) return await r.text();
    }catch(e){}
    const r2 = await fetch(apiUrl, {headers:{"Accept":"application/vnd.github+json"},cache:"no-store"});
    if(!r2.ok) throw new Error(`GitHub respondeu ${r2.status}.`);
    const data = await r2.json();
    const binary = atob((data.content||"").replace(/\s/g,""));
    const bytes = Uint8Array.from(binary, c=>c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  }

  try{
    let html = await getOriginal();

    // Remoção completa da funcionalidade de recordes para este jogo.
    if (sourcePath === "Adivinhando-emocoes/index.html") {
      html = html
        .replace("saveScore(playerName, score, selectedDifficultyKey);", "/* recordes desativados */")
        .replace("window.onload = () => initializeFirebase();", 'window.onload = () => { startGameButton.disabled = false; startGameButton.textContent = "Começar a Jogar!"; };')
        .replace("Aprenda sobre emoções e salve seus acertos!", "Aprenda e pratique o reconhecimento de emoções!");
      html = html.replace("</head>", '<style>#leaderboard-btn,#leaderboard-modal{display:none!important}</style></head>');
    }
    if (sourcePath === "Conecta-emo-es/index.html") {
      html = html
        .replace('saveScore(playerName, score, `${selectedMode}-${selectedDifficulty}`);', "/* recordes desativados */")
        .replace("window.onload = initializeFirebase;", 'window.onload = () => { startButton.disabled = false; startButton.textContent = "Começar"; };');
      html = html.replace("</head>", '<style>#leaderboard-btn,#leaderboard-modal{display:none!important}</style></head>');
    }

    // Base fixa para qualquer recurso relativo do jogo original.
    const baseTag = `<base href="${rawBase}">`;
    if(/<head[^>]*>/i.test(html)){
      html = html.replace(/<head([^>]*)>/i, `<head$1>${baseTag}`);
    }else{
      html = `${baseTag}${html}`;
    }

    const styleTag = `<style id="dani-paises-visual-remaster">${remasterCss}</style>`;
    if(/<\/head>/i.test(html)){
      html = html.replace(/<\/head>/i, `${styleTag}</head>`);
    }else{
      html = styleTag + html;
    }

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const box = document.getElementById("error");
    box.style.display = "block";
    box.textContent = "Não foi possível carregar o jogo original.\n\n" + (err?.message || err) +
      "\n\nVerifique sua internet e tente abrir o arquivo novamente.";
    document.querySelector(".bar").style.display = "none";
  }
})();
</script>
</body>
</html>
