<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Controle • Dani Países</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1326;color:#f2f5ff;font:16px system-ui;touch-action:none}main{max-width:800px;margin:auto;padding:18px}h1{font-size:25px;color:#ffd05a}input,select,button{font:inherit;padding:12px;border-radius:12px;background:#25344f;border:1px solid #617392;color:white}input,select{width:100%;margin:7px 0}button{touch-action:none;user-select:none}button:active,.pressed{background:#ffe097!important;color:#14213a}.primary{background:#ffd05a;color:#18233e;font-weight:bold;width:100%}#controller{display:none}.controls{display:flex;justify-content:space-between;align-items:center;gap:15px;height:65vh}.stick{width:150px;height:150px;border:3px solid #667d9f;border-radius:50%;position:relative;background:#162542;flex-shrink:0;touch-action:none}.knob{position:absolute;left:calc(50% - 25px);top:calc(50% - 25px);width:50px;height:50px;border-radius:50%;background:#82d8ff;pointer-events:none}.buttons{display:grid;grid-template-columns:repeat(3,minmax(55px,90px));gap:9px}.buttons button{height:65px;font-size:12px;font-weight:bold;padding:5px}#status{padding:12px;border:1px solid #536b8e;border-radius:12px;font-size:13px}.hint{font-size:12px;color:#b0c5df}#error{color:#ff9696}@media(orientation:portrait){.controls{height:55vh;gap:8px}.stick{width:115px;height:115px}.buttons{gap:5px;grid-template-columns:repeat(3,55px)}.buttons button{height:58px}}@media(max-height:450px){main{padding:8px}h1{display:none}.controls{height:68vh}#status{padding:6px}}</style><main><h1>DANI PAÍSES • CONTROLE</h1><section id="join"><p>Este celular será seu controle. A partida aparece na TV.</p><label>Seu nome<input id="name" maxlength="24" placeholder="Jogador"></label><label>Personagem<select id="character"></select></label><button id="enter" class="primary">ENTRAR NA SALA</button><p id="error"></p></section><section id="controller"><div id="status">Conectando…</div><div class="controls"><div class="stick" id="stick" aria-label="Mover: esquerda/direita; cima salto; baixo defesa"><div class="knob" id="knob"></div></div><div class="buttons"><button data-action="jump">X / Y<br>PULAR</button><button data-action="smashAttack">A<br>ATACAR</button><button data-action="special">B<br>ESPECIAL</button><button data-action="block">ESCUDO</button><button data-action="grab">AGARRAR</button><button data-action="ultimate">FINAL</button><button data-action="heavy">FORTE</button><button data-action="uppercut">GANCHO</button><button id="fullscreen">TELA CHEIA</button></div></div><p class="hint">Pode segurar o ataque. Vire o celular para mais espaço. A conexão funciona pela rede local.</p></section></main><script>
const roster=[['dani','Dani Países'],['br','Brasil'],['ar','Argentina'],['uy','Uruguai'],['py','Paraguai'],['cl','Chile'],['bo','Bolívia'],['pe','Peru'],['ec','Equador'],['co','Colômbia'],['ve','Venezuela'],['gy','Guiana'],['sr','Suriname'],['gf','Guiana Francesa'],['ca','Canadá'],['mx','México'],['us','Estados Unidos'],['gt','Guatemala'],['bz','Belize'],['hn','Honduras'],['sv','El Salvador'],['ni','Nicarágua'],['cr','Costa Rica'],['pa','Panamá']];const $=id=>document.getElementById(id);for(const [id,name]of roster){const o=document.createElement('option');o.value=id;o.textContent=name;$('character').append(o)}
let session=null,seq=0,busy=false,stickKeys={},buttons={},stickId=null,enabled=false,events,lastRoom=null;const room=new URLSearchParams(location.search).get('room')||'';async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
function release(){stickKeys={};buttons={};stickId=null;$('knob').style.transform='';document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed'));send()}
async function send(){if(!session||busy)return;busy=true;try{await post('/api/input',{key:session.token,seq:++seq,input:enabled?{...stickKeys,...buttons}:{}})}catch{$('status').textContent='Conexão interrompida. Reconectando…';enabled=false}finally{busy=false}}
function connect(){events?.close();events=new EventSource('/api/events?key='+encodeURIComponent(session.token));events.onmessage=e=>{const d=JSON.parse(e.data);lastRoom=d;enabled=d.phase==='fight'&&d.active.includes(session.id)&&d.hostAlive;const slot=d.active.indexOf(session.id);$('status').textContent=!d.hostAlive?'A tela principal está desconectada. Aguarde.':enabled?'JOGADOR '+(slot+1)+' • '+session.name:d.phase==='paused'?'PARTIDA PAUSADA':d.active.includes(session.id)?'Aguardando a próxima partida…':'Você está no lobby. A TV organiza a partida.';if(!enabled)release()};events.onerror=async()=>{enabled=false;release();$('status').textContent='Conexão perdida. Aguardando o servidor…';try{const r=await fetch('/api/state?key='+encodeURIComponent(session.token));if(r.status===403){events.close();sessionStorage.removeItem('dani-room-'+room);session=null;$('join').style.display='block';$('controller').style.display='none';$('error').textContent='O servidor reiniciou. Escaneie o novo QR code na TV.'}}catch{}}}
$('enter').onclick=async()=>{try{session=await post('/api/join',{room,name:$('name').value.trim(),character:$('character').value});sessionStorage.setItem('dani-room-'+room,JSON.stringify(session));$('join').style.display='none';$('controller').style.display='block';connect();try{await document.documentElement.requestFullscreen()}catch{}}catch(e){$('error').textContent=e.message}};
try{session=JSON.parse(sessionStorage.getItem('dani-room-'+room)||'null');if(session){$('join').style.display='none';$('controller').style.display='block';connect()}}catch{}
for(const b of document.querySelectorAll('[data-action]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);buttons[b.dataset.action]=true;b.classList.add('pressed');send()};const up=()=>{delete buttons[b.dataset.action];b.classList.remove('pressed');send()};b.onpointerup=b.onpointercancel=b.onlostpointercapture=up}
function move(e){if(e.pointerId!==stickId)return;const r=$('stick').getBoundingClientRect(),radius=r.width*.38;let x=(e.clientX-r.left-r.width/2)/radius,y=(e.clientY-r.top-r.height/2)/radius;const n=Math.hypot(x,y);if(n>1){x/=n;y/=n}stickKeys={left:x<-.22,right:x>.22,up:y<-.5,down:y>.5,jump:y<-.6,block:y>.6};$('knob').style.transform='translate('+x*radius+'px,'+y*radius+'px)';send()}
$('stick').onpointerdown=e=>{e.preventDefault();if(stickId!==null)return;stickId=e.pointerId;$('stick').setPointerCapture(stickId);move(e)};$('stick').onpointermove=move;for(const name of ['pointerup','pointercancel','lostpointercapture'])$('stick').addEventListener(name,e=>{if(e.pointerId===stickId){stickId=null;stickKeys={};$('knob').style.transform='';send()}});$('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});setInterval(send,40);
</script></html>
