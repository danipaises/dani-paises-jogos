<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Cobrinha do Dani Países — Remaster</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{display:grid;place-items:center;background:#08111f;color:#e5eefc;padding:24px}
  .loader{width:min(620px,100%);padding:28px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(15,23,42,.82);box-shadow:0 30px 90px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
  .loader h1{margin:0 0 10px;font-size:clamp(1.45rem,4vw,2.25rem)}
  .loader p{margin:8px 0;color:#bfd0e7;line-height:1.55}
  .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:20px}
  .bar i{display:block;height:100%;width:42%;border-radius:inherit;background:linear-gradient(90deg,#059669,#84cc16);animation:load 1.05s ease-in-out infinite alternate}
  @keyframes load{to{transform:translateX(138%)}}
  .error{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#3f1118;color:#fecaca;white-space:pre-wrap}
</style>
</head>
<body>
<main class="loader" aria-live="polite">
  <h1>Cobrinha do Dani Países — Remaster</h1>
  <p>Carregando a versão original do jogo e aplicando o remaster visual sem alterar a lógica de pontuação e recordes.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="error" id="error"></div>
</main>
<script>
(async()=>{
  const sourcePath = "Cobrinha-do-Dani-paises/index.html";
  const commit = "6fb3b231e226c51af22dade20d36e6d339ca06d7";
  const owner = "danipaises";
  const repo = "dani-paises-jogos";
  const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${commit}/${sourcePath.split('/').map(encodeURIComponent).join('/')}`;
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${sourcePath.split('/').map(encodeURIComponent).join('/')}?ref=${commit}`;
  const folderPath = sourcePath.slice(0, sourcePath.lastIndexOf('/') + 1);
  const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/${commit}/${folderPath.split('/').filter(Boolean).map(encodeURIComponent).join('/')}/`;
  const remasterCss = "\n:root{--dp-accent:#059669;--dp-accent-2:#84cc16;--dp-shadow:0 24px 70px rgba(2,6,23,.24);--dp-radius:22px}html{min-height:100%;background:#07111f}body{min-height:100vh;background:radial-gradient(circle at 12% 8%,rgba(5,150,105,.28),transparent 33rem),radial-gradient(circle at 88% 16%,rgba(132,204,22,.22),transparent 30rem),linear-gradient(145deg,#07111f 0%,#101a31 50%,#07131f 100%)!important;background-attachment:fixed!important}body::before{content:\"\";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:36px 36px}body>*{position:relative;z-index:1}:is(.container,.card,.game-card,.start-card,.panel,.game-panel,#game-container,#start-screen,#mode-selection-screen,#difficulty-selection-screen,#menu,#game,#app,#quiz-container,#leaderboard-modal .modal-content){border-radius:var(--dp-radius)!important}:is(.card,.game-card,.start-card,.panel,.game-panel,#game-container,#start-screen,#mode-selection-screen,#difficulty-selection-screen,#menu,#quiz-container,#leaderboard-modal .modal-content){box-shadow:var(--dp-shadow)!important;border:1px solid rgba(255,255,255,.72)!important;backdrop-filter:blur(18px) saturate(1.12)}button,.btn,[role=\"button\"]{border-radius:14px!important;box-shadow:0 10px 24px rgba(2,6,23,.16)!important;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease!important;touch-action:manipulation}@media(hover:hover) and (pointer:fine){button:hover,.btn:hover,[role=\"button\"]:hover{transform:translateY(-2px);box-shadow:0 15px 32px rgba(2,6,23,.22)!important;filter:saturate(1.08) brightness(1.03)}}button:active,.btn:active,[role=\"button\"]:active{transform:translateY(0) scale(.985)}button:focus-visible,.btn:focus-visible,[role=\"button\"]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--dp-accent-2)!important;outline-offset:3px!important}input,select,textarea{border-radius:14px!important;box-shadow:0 7px 20px rgba(2,6,23,.08)}h1,h2,h3{text-wrap:balance;text-shadow:0 5px 18px rgba(2,6,23,.08)}canvas{max-width:100%;height:auto;border-radius:20px!important;box-shadow:0 22px 60px rgba(2,6,23,.26)!important;outline:1px solid rgba(255,255,255,.58);background:linear-gradient(180deg,rgba(5,150,105,.09),rgba(132,204,22,.05))!important}:is(#score,#best-score,#high-score,#record,[id*=\"score\"],[id*=\"record\"],[class*=\"score\"],[class*=\"record\"]){font-variant-numeric:tabular-nums}@media(max-width:640px){body{background-attachment:scroll!important}:is(.card,.game-card,.start-card,.panel,.game-panel,#game-container,#start-screen,#menu,#quiz-container){border-radius:18px!important}button,.btn,[role=\"button\"]{min-height:46px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}";
  async function getOriginal(){try{const r=await fetch(rawUrl,{cache:"no-store"});if(r.ok)return await r.text()}catch(e){}const r2=await fetch(apiUrl,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});if(!r2.ok)throw new Error(`GitHub respondeu ${r2.status}.`);const data=await r2.json();const binary=atob((data.content||"").replace(/\s/g,""));return new TextDecoder("utf-8").decode(Uint8Array.from(binary,c=>c.charCodeAt(0)))}
  try{let html=await getOriginal();const baseTag=`<base href="${rawBase}">`;html=/<head[^>]*>/i.test(html)?html.replace(/<head([^>]*)>/i,`<head$1>${baseTag}`):`${baseTag}${html}`;const styleTag=`<style id="dani-paises-visual-remaster">${remasterCss}</style>`;html=/<\/head>/i.test(html)?html.replace(/<\/head>/i,`${styleTag}</head>`):styleTag+html;document.open();document.write(html);document.close()}catch(err){const box=document.getElementById("error");box.style.display="block";box.textContent="Não foi possível carregar o jogo original.\n\n"+(err?.message||err);document.querySelector(".bar").style.display="none"}
})();
</script>
</body>
</html>
